[project]
name = "disaster-app"
version = "0.1.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.0",
    "peft>=0.6.0",
    # Match the Gradio SDK version used by the Hugging Face Space (README_spaces.md)
    "gradio>=5.29.0,<6",
    "huggingface-hub>=0.20.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
# Keep macOS on the same torch minor version as the CUDA 12.1 wheels
constraint-dependencies = [
    "torch<2.6; sys_platform == 'darwin'",
    "torchvision<0.21; sys_platform == 'darwin'",
]

# CUDA 12.1 wheels exist only for Linux/Windows; macOS falls back to PyPI (CPU/MPS)
[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
